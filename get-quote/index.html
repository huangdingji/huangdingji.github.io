<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inquiry Form Has Moved | FuJianTeflonTape</title>
  <meta name="description" content="Send PTFE tape quotation requests through our contact form.">
  <link rel="canonical" href="https://www.qzjy.store/contact/">
  <script>
    (() => {
      const destination = new URL('/contact/', window.location.origin);
      destination.search = window.location.search;
      const params = destination.searchParams;
      const value = key => (params.get(key) || '').trim();
      const known = text => text && !/^not sure\s*\/\s*need recommendation$/i.test(text);
      // Preserve current links and translate the retired form's field names.
      if (!value('size')) {
        const dimensions = [['Width', 'width'], ['Thickness', 'thickness'], ['Length', 'product_size']]
          .filter(([, key]) => known(value(key)))
          .map(([label, key]) => label + ': ' + value(key));
        if (dimensions.length) params.set('size', dimensions.join('; '));
      }
      if (!value('packing') && value('packaging')) params.set('packing', value('packaging'));
      if (value('oem_required')) {
        if (!value('range') && /^yes$/i.test(value('oem_required'))) params.set('range', 'OEM branded PTFE tape');
        params.set('message', [value('message'), 'OEM required: ' + value('oem_required')].filter(Boolean).join('\n\n'));
      }
      destination.hash = 'quoteForm';
      window.location.replace(destination.href);
    })();
  </script>
  <meta http-equiv="refresh" content="0; url=/contact/#quoteForm">
  <style>
    body{margin:0;background:#edf3f6;color:#253038;font:17px/1.8 Arial,Helvetica,sans-serif}
    main{box-sizing:border-box;width:min(640px,calc(100% - 36px));margin:12vh auto;padding:30px;background:#f8fafc;border:1px solid #c2d4e2}
    h1{font-size:30px;line-height:1.25;font-weight:500;letter-spacing:-.6px}
    a{color:#165f96;text-underline-offset:3px}
    a:focus-visible{outline:3px solid #4596d1;outline-offset:4px}
  </style>
</head>
<body>
  <main>
    <h1>Our inquiry form has moved.</h1>
    <p>Please use our contact form for PTFE tape specifications, quantities and packing requirements.</p>
    <p><a href="/contact/#quoteForm">Continue to the inquiry form</a></p>
  </main>
</body>
</html>
